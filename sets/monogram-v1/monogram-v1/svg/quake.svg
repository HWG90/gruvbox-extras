<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf33"/>
      <stop offset="1" stop-color="#d7a228"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="8" y="8" width="496" height="496" rx="100" ry="100"/>
    </clipPath>
    <pattern id="tex" width="24" height="24" patternUnits="userSpaceOnUse"
             patternTransform="rotate(45 256 256)">
      <rect width="12" height="24" fill="#000000" opacity="0.08"/>
    </pattern>  </defs>
  <rect x="8" y="8" width="496" height="496" rx="100" ry="100" fill="url(#tile)"/>
    <g clip-path="url(#clip)">
      <rect x="8" y="8" width="496" height="496" fill="url(#tex)"/>
    </g>
  <rect x="14" y="14" width="484" height="484" rx="94" ry="94" fill="none"
        stroke="#282828" stroke-opacity="0.22" stroke-width="6"/>
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="DejaVu Sans Condensed" font-weight="bold"
        font-size="279.33" fill="#282828">Q</text>
</svg>
